name: Verify ProofDesk
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exact-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: node --check web/app.js && node --check web/investigations.js
      - name: Install the pinned official MCP client
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: tests/interop
      - run: node tests/interop/interop.cjs
