[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proofdesk"
version = "0.1.0"
description = "Mathematical assistant tools with independent checking and replayable receipts"
requires-python = ">=3.12"
license = {text = "MIT; vendored NOETHER-FORGE is Apache-2.0"}
dependencies = []

[tool.setuptools.packages.find]
include = ["proofdesk*"]
